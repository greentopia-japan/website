<title>Tower First Aid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
:root{
  --paper:#F5F7F2; --surface:#FFFFFF; --surface-2:#EBEFE6;
  --ink:#14201A; --muted:#5C6B62; --line:#DBE2D6;
  --accent:#1E6B47; --accent-soft:#E2EFE7; --accent-ink:#115334; --on-accent:#FFFFFF;
  --warn:#9C5300; --warn-soft:#FAEDDA; --warn-line:#E7C99B;
  --danger:#A33226; --danger-soft:#F9E6E3; --danger-line:#E6B7B0;
  --shadow:0 1px 2px rgba(20,32,26,.05), 0 10px 26px rgba(20,32,26,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1411; --surface:#172019; --surface-2:#212B24;
    --ink:#E7EFE8; --muted:#9BAAA0; --line:#2C362E;
    --accent:#52BE87; --accent-soft:#16301F; --accent-ink:#8FDCB2; --on-accent:#0E1411;
    --warn:#E3A459; --warn-soft:#2C2317; --warn-line:#4A3A20;
    --danger:#E9867A; --danger-soft:#31201D; --danger-line:#4E2E29;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1411; --surface:#172019; --surface-2:#212B24;
  --ink:#E7EFE8; --muted:#9BAAA0; --line:#2C362E;
  --accent:#52BE87; --accent-soft:#16301F; --accent-ink:#8FDCB2; --on-accent:#0E1411;
  --warn:#E3A459; --warn-soft:#2C2317; --warn-line:#4A3A20;
  --danger:#E9867A; --danger-soft:#31201D; --danger-line:#4E2E29;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  font-size:16px; line-height:1.62; -webkit-text-size-adjust:100%;
}
h1,h2,.brand-name{font-family:"Zilla Slab","Noto Sans JP",Georgia,serif; text-wrap:balance}

.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topbar-in{max-width:620px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.leafmark{flex:0 0 auto}
.brand-name{font-weight:700; font-size:15px; letter-spacing:.01em; white-space:nowrap}
.brand-sub{font-size:11px; color:var(--muted); letter-spacing:.09em; text-transform:uppercase; white-space:nowrap}
.spacer{flex:1 1 auto}
.langtoggle{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface)}
.langtoggle button{
  font:inherit; font-size:12px; font-weight:600; padding:6px 11px; border:0; cursor:pointer;
  background:transparent; color:var(--muted); line-height:1.3;
}
.langtoggle button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}

.wrap{max-width:620px; margin:0 auto; padding:20px 16px 48px}

.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 20px}
.card h1{font-size:1.42rem; line-height:1.28; margin:0 0 12px; font-weight:700}
.lede{color:var(--muted); font-size:.95rem; margin:0 0 18px}
.prose p{margin:0 0 14px}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:700}
.kbd{font-weight:700; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:1px 7px; white-space:nowrap}

.banner{display:flex; gap:11px; align-items:flex-start; border-radius:10px; padding:12px 14px; margin:0 0 18px; font-size:.93rem; line-height:1.55}
.banner .ico{flex:0 0 auto; margin-top:2px}
.banner.warn{background:var(--warn-soft); border:1px solid var(--warn-line); color:var(--ink)}
.banner.warn .ico{color:var(--warn)}
.banner.stop{background:var(--danger-soft); border:1px solid var(--danger-line); color:var(--ink)}
.banner.stop .ico{color:var(--danger)}
.banner.good{background:var(--accent-soft); border:1px solid var(--line); color:var(--ink)}
.banner.good .ico{color:var(--accent)}

.photos{display:grid; gap:12px; margin:18px 0 4px}
.photos.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:359px){.photos.two{grid-template-columns:1fr}}
figure{margin:0}
figure img{
  display:block; width:100%; max-width:100%; height:auto; max-height:330px; object-fit:contain;
  border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
}
figcaption{font-size:.8rem; color:var(--muted); margin-top:6px; line-height:1.45}

.opts{display:flex; flex-direction:column; gap:10px; margin-top:22px}
.opt{
  font:inherit; font-size:.98rem; font-weight:500; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:12px; min-height:54px;
  padding:13px 15px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); transition:border-color .12s, background .12s, transform .06s;
}
.opt:hover{border-color:var(--accent); background:var(--accent-soft)}
.opt:active{transform:translateY(1px)}
.opt .txt{flex:1 1 auto}
.opt .chev{flex:0 0 auto; color:var(--muted)}
.opt:hover .chev{color:var(--accent)}
.opt.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}
.opt.primary .chev{color:var(--on-accent); opacity:.75}
.opt.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink); color:var(--surface)}
.opt.quiet{color:var(--muted)}
.optgroup{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  color:var(--muted); margin:10px 0 -2px 2px;
}
.optgroup:first-child{margin-top:0}
.opt:focus-visible, .langtoggle button:focus-visible, .navbtn:focus-visible, .linkish:focus-visible, textarea:focus-visible{
  outline:2.5px solid var(--accent); outline-offset:2px;
}

.nav{display:flex; gap:10px; align-items:center; margin-top:20px; flex-wrap:wrap}
.navbtn{
  font:inherit; font-size:.88rem; font-weight:600; cursor:pointer;
  background:transparent; border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:8px 15px;
}
.navbtn:hover{color:var(--ink); border-color:var(--muted)}

details.trail{margin-top:18px; border-top:1px solid var(--line); padding-top:14px}
details.trail summary{cursor:pointer; font-size:.83rem; color:var(--muted); font-weight:600; letter-spacing:.04em; list-style:none}
details.trail summary::-webkit-details-marker{display:none}
details.trail summary::before{content:"▸ "}
details.trail[open] summary::before{content:"▾ "}
.trail ol{margin:12px 0 0; padding:0 0 0 18px; font-size:.86rem; color:var(--muted); line-height:1.5}
.trail li{margin-bottom:6px}

textarea.box{
  width:100%; resize:vertical; font:inherit; font-size:.88rem; line-height:1.55;
  padding:13px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); margin-top:6px;
}
textarea.box.readonly{min-height:150px; color:var(--muted)}
textarea.box.note{min-height:130px; background:var(--surface)}
.mailrow{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px}
.linkish{font-weight:700; color:var(--accent); text-decoration:none; border-bottom:2px solid var(--accent-soft)}
.linkish:hover{border-bottom-color:var(--accent)}
.fieldlabel{font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:22px}
.hint{font-size:.83rem; color:var(--muted); margin:4px 0 0}

.foot{margin-top:26px; text-align:center; font-size:.78rem; color:var(--muted); line-height:1.6}
.foot a{color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <span class="brand">
      <svg class="leafmark" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 4C10 4 4.5 8.5 4.5 15.5c0 1.6.4 3 1.1 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:var(--accent)"/>
        <path d="M20 4c0 9-5.5 13.5-12.5 13.5-.8 0-1.6-.1-2.3-.3C6.5 10.5 12 6 20 4Z" fill="currentColor" style="color:var(--accent)" opacity=".9"/>
      </svg>
      <span>
        <span class="brand-name">Greentopia</span><br>
        <span class="brand-sub" id="brandsub">Tower first aid</span>
      </span>
    </span>
    <span class="spacer"></span>
    <span class="langtoggle" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-ja" aria-pressed="false">日本語</button>
    </span>
  </div>
</header>

<main class="wrap">
  <div id="stage" class="card"></div>
  <div class="foot" id="foot"></div>
</main>

n_dose10:{

         "Measure A and B separately with your cup or syringe and add them one after the other. <strong>Never mix A and B together directly without water</strong> — they have to meet in the diluted solution, not in the measuring cup.",

         "You can mix the nutrients into your container first, or pour them into the reservoir after the water."],
      opts:[{l:"Done — continue",to:"@resume",cls:"primary",fallback:"w_pump"}]},
  ja:{t:"レタス・ハーブ・サラダ用の葉物",
      p:["お手持ちの容器やバケツに合わせて、1Lあたりそれぞれ2mlで計算してください。5Lの容器ならAとBを各10ml、10Lのバケツなら各20mlです。",
         "計量カップまたはシリンジでAとBを別々に計り、順番に加えてください。<strong>AとBを水なしで直接混ぜないでください。</strong>必ず希釈された水の中で混ざるようにします。",
         "混植の場合もサラダ用葉物と同じ量で構いません。少ない方の量がタワー全体に適しています。",
         "容器の中で先に混ぜても、給水後に貯水タンクへ直接入れても構いません。"],
      opts:[{l:"完了 — 次へ進む",to:"@resume",cls:"primary",fallback:"w_pump"}]}
},

w_pump:{
  path:{en:"Water · 2",ja:"水 · 2"},
  photos:[["pumpI","Indoor tower: stop on I. The red light is on while the pump runs.","屋内タワー：「I」で止めます。ポンプ作動中は赤いランプが点灯します。"],
          ["pumpO","Outdoor tower: stop on O.","屋外タワー：「O」で止めます。"]],
  en:{t:"Start the pump and listen",
      p:["Find the <strong>black pump timer</strong> — the small box on the pump's cable with a green letter on it. Each press of the round button switches between <span class=\"kbd\">I</span> and <span class=\"kbd\">O</span>, and starts that cycle over from the beginning. There's no off position: the pump stops by itself when the cycle finishes.",
         "Press until it shows <span class=\"kbd\">I</span> for an <strong>indoor</strong> tower, or <span class=\"kbd\">O</span> for an <strong>outdoor</strong> tower. The pump starts the moment you land on a setting, so you should hear it right away. Outdoor towers water more often, because wind and sun dry the plants out faster.",
         "Can you hear the pump running?"],
      opts:[
        {l:"Yes, it's running",to:"w_flow"},
        {l:"No — nothing happens",to:"w_pumpplugs"}
      ]},
  ja:{t:"ポンプを動かして、音を確かめてください",
      p:["ポンプのケーブルに付いている、緑色の文字が表示された小さな<strong>黒いポンプタイマー</strong>を探してください。丸いボタンを押すたびに <span class=\"kbd\">I</span> と <span class=\"kbd\">O</span> が切り替わり、そのサイクルが最初からやり直しになります。「切」の位置はありません。サイクルが終われば自動的に停止します。",
         "<strong>屋内</strong>タワーは <span class=\"kbd\">I</span>、<strong>屋外</strong>タワーは <span class=\"kbd\">O</span> が表示されるまで押してください。設定に切り替わった瞬間に運転が始まるので、すぐに音が聞こえるはずです。屋外タワーは風と日射で乾きやすいため、散水の頻度が高く設定されています。",
         "ポンプの作動音は聞こえますか？"],
      opts:[
        {l:"はい、動いています",to:"w_flow"},
        {l:"いいえ — 何も起きません",to:"w_pumpplugs"}
      ]}
},

w_pumpcheck:{
  path:{en:"Water · 3",ja:"水 · 3"},
  en:{t:"Look into the reservoir while it runs",
      p:["Three things to check on the pump itself:",
         "<strong>1. It should be standing upright</strong> on the floor of the reservoir, resting on its feet, not tipped onto its side.<br><strong>2. Nothing should be blocking the intake</strong> — roots, fallen leaves and debris collect there.<br><strong>3. No water should be squirting out</strong> of the sides of the pump or the joint where the hose meets it.",
         "Set the pump upright, clear anything around it, and watch the ports again."],
      opts:[
        {l:"Water's coming through now",to:"done_water"},
        {l:"Still nothing reaching the top",to:"contact",note:"Pump runs but no flow. Pump confirmed upright, intake clear, no visible leak."}
      ]},
  ja:{t:"運転中の貯水タンクの中を確認してください",
      p:["ポンプ本体について、3点を確認してください。",
         "<strong>1. タンクの底にまっすぐ立っているか。</strong>脚で支えられ、横に倒れていませんか。<br><strong>2. 吸込口が塞がれていないか。</strong>根や落ち葉、ゴミがたまりやすい場所です。<br><strong>3. 側面やホースの接続部から水が噴き出していないか。</strong>",
         "ポンプを正しく立て、周囲のゴミを取り除いてから、もう一度ポートを観察してください。"],
      opts:[
        {l:"水が流れるようになりました",to:"done_water"},
        {l:"まだ上まで水が上がりません",to:"contact",note:"Pump runs but no flow. Pump confirmed upright, intake clear, no visible leak."}
      ]}
},

u_level:{
  path:{en:"Water · Level",ja:"水 · 水平"},
  en:{t:"Start with how the tower sits",
      p:["When a tower tilts even slightly, the water runs to the low side and the ports on the high side dry out. That's the usual reason some plants wilt while their neighbors look fine.",
         "Check it with a level — the level app on your phone is accurate enough — and put a thin shim under the base until it sits flat. Then run the pump and watch the dry side again."],
      opts:[
        {l:"Every port is getting wet now",to:"done_water"},
        {l:"It's level, but one side still stays dry",to:"u_pumpinspect"}
      ]},
  ja:{t:"まずタワーの傾きを確認してください",
      p:["タワーがわずかでも傾くと、水は低い側へ流れ、高い側のポートが乾いてしまいます。隣り合う株のうち一部だけがしおれる場合、これが主な原因です。",
         "水平器（スマートフォンの水平器アプリで十分です）で確認し、台座の下に薄い詰め物を入れて水平にしてください。その後ポンプを動かし、乾いていた側をもう一度確認します。"],
      opts:[
        {l:"すべてのポートが濡れるようになりました",to:"done_water"},
        {l:"水平にしても片側が乾いたままです",to:"u_pumpinspect"}
      ]}
},

u_pumpinspect:{
  path:{en:"Water · Level",ja:"水 · 水平"},
  banner:{kind:"warn",
    en:"A level tower with dry ports usually means the pump isn't running at full strength.",
    ja:"タワーが水平なのに乾いたポートがある場合、ポンプが本来の力を出していないことがほとんどです。"},
  en:{t:"Take a close look at the pump",
      p:["If the tower is level and water still isn't reaching every port, the pump isn't pushing hard enough to get it all the way to the top. Three things cause that, and all three are worth checking by eye before you give up:",
         "<strong>1. Position.</strong> The pump should be sitting flat on the floor of the reservoir in an upright, vertical position — not leaning, not propped on a cable.<br><strong>2. Feet.</strong> The suction feet should be attached firmly to the base. A pump that has come loose vibrates and loses pressure.<br><strong>3. Roots.</strong> Roots creep into the intake over time and choke it. Lift the pump out and look — clear anything wrapped around or inside it.",
         "Put the pump back, run it, and watch the dry side once more."],
      opts:[
        {l:"That fixed it — every port is wet",to:"done_water"},
        {l:"Pump looks fine, ports still dry",to:"contact",note:"Tower levelled. Pump inspected: upright, feet attached, intake clear of roots. Flow still uneven — possible weak pump."}
      ]},
  ja:{t:"ポンプを目視で確認してください",
      p:["タワーが水平なのに水が全てのポートに届かない場合、ポンプの力が頂部まで押し上げるのに足りていません。原因は主に3つで、いずれも目で見て確認できます。諦める前に必ずご確認ください。",
         "<strong>1. 設置。</strong>ポンプが貯水タンクの底に、まっすぐ垂直に置かれているか。傾いていたり、ケーブルの上に乗っていたりしませんか。<br><strong>2. 吸盤脚。</strong>吸盤がしっかり底面に固定されているか。外れていると振動し、圧力が落ちます。<br><strong>3. 根詰まり。</strong>時間が経つと根が吸込口に入り込み、詰まらせます。ポンプを取り出して確認し、絡みついた根を取り除いてください。",
         "ポンプを戻して運転し、乾いていた側をもう一度確認します。"],
      opts:[
        {l:"解決しました — 全てのポートが濡れています",to:"done_water"},
        {l:"ポンプに問題はないが、まだ乾いている",to:"contact",note:"Tower levelled. Pump inspected: upright, feet attached, intake clear of roots. Flow still uneven — possible weak pump."}
      ]}
},

        {l:"Outdoor, no lights",to:"g_pests",set:{growthNext:"g_nutrient"}}
      ]},
  ja:{t:"育成ライト付きの屋内タワーですか？",
      p:["屋内タワーには補助照明が必要です。屋外タワーは太陽光で十分なため、ライトは設置していません。"],
      opts:[
        {l:"屋内・育成ライトあり",to:"g_pests",set:{growthNext:"g_lights"}},
        {l:"屋外・ライトなし",to:"g_pests",set:{growthNext:"g_nutrient"}}
      ]}
},

g_pests:{
  path:{en:"Growth · 2",ja:"生育 · 2"},
  en:{t:"Turn a few leaves over",
      p:["Pests are worth ruling out first, because they're the one cause that gets worse while you're checking everything else.",
         "Pick a few of the worst-looking plants and look at the <strong>undersides</strong> of the leaves and the point where each leaf joins the stem. You're looking for small insects, fine webbing, sticky residue, or trails and holes chewed in the leaf.",
         "Do you see any of that?"],
      opts:[
        {l:"Yes — there's something on the leaves",to:"pests"},
        {l:"No — the leaves and undersides look clean",to:"@state.growthNext",fallback:"g_nutrient"}
      ]},
  ja:{t:"葉を何枚かめくって確認してください",
      p:["病害虫は最初に確認すべき項目です。他を調べている間にも被害が広がる、唯一の原因だからです。",
         "状態の悪い株をいくつか選び、<strong>葉の裏側</strong>と、葉が茎につながる付け根を見てください。小さな虫、細かいクモの巣状のもの、べたつき、食害の跡や穴がないか確認します。",
         "何か見つかりましたか？"],
      opts:[
        {l:"はい — 葉に何か付いています",to:"pests"},
        {l:"いいえ — 葉も葉裏もきれいです",to:"@state.growthNext",fallback:"g_nutrient"}
      ]}
},

g_lights:{
  path:{en:"Growth · 3",ja:"生育 · 3"},
  en:{t:"Are the lights coming on every day?",
      p:["We aim for 12 hours a day. Eight is the minimum the plants will tolerate, and past about 14 they start to suffer. If your lights are scheduled for the night, you may never have seen them on — there's a quick way to test that.",
         "Are you sure they're running?"],
      opts:[
        {l:"Yes, they run on schedule",to:"g_toomuch"},
        {l:"No, or I'm not sure",to:"l_plugs",resume:"g_toomuch"}
      ]},
  ja:{t:"ライトは毎日点灯していますか？",
      p:["1日12時間を目安にしています。最低8時間は必要で、14時間を超えると植物に負担がかかります。夜間点灯の設定の場合、実際に点いているところを見たことがないかもしれません。簡単に確認する方法があります。",
         "点灯していると確信できますか？"],
      opts:[
        {l:"はい、設定どおり点灯しています",to:"g_toomuch"},
        {l:"いいえ、または分かりません",to:"l_plugs",resume:"g_toomuch"}
      ]}
},

g_toomuch:{
  path:{en:"Growth · 4",ja:"生育 · 4"},
  en:{t:"Now look closely at the leaves",
      p:["Too much light damages plants as surely as too little. The usual cause is a timer left in always-on mode, so the plants never get a dark period.",
         "Are the leaf edges turning <strong>brown, dry and crispy</strong>, with the leaves themselves thick and leathery rather than tender? Growth may also look stunted or oddly yellow."],
      opts:[
        {l:"Yes, that's what I'm seeing",to:"t_check"},
        {l:"No, the leaves look normal in shape",to:"g_nutrient"}
      ]},
  ja:{t:"次に葉をよく観察してください",
      p:["光は不足しても過剰でも植物を傷めます。多いのは、タイマーが常時通電のままになっていて、暗い時間が確保されていないケースです。",
         "葉の縁が<strong>茶色く乾いてパリパリになり</strong>、葉自体も柔らかさを失って厚く硬くなっていませんか。生育が止まったり、不自然に黄色くなることもあります。"],
      opts:[
        {l:"はい、その状態です",to:"t_check"},
        {l:"いいえ、葉の形は正常です",to:"g_nutrient"}
      ]}
},

g_light_fix:{
  path:{en:"Growth · 4",ja:"生育 · 4"},
  photos:[["ltSwitch","The side switch. Down is タイマー (timer); up is 常時通電 (always on).","側面のスイッチ。下が「タイマー」、上が「常時通電」です。"]],
  en:{t:"That's light stress — give them a night",
      p:["Slide the switch on the side of the white timer down to <span class=\"kbd\">タイマー</span> (timer), so the schedule takes over again.",
         "Then set the dial to 12 hours a day. Never less than 8, and never more than 14. Each pin is 15 minutes; pins pushed down are the hours the lights are on. Split it however suits the room: all in one block, or six hours morning and six hours evening.",
         "Damaged leaves won't recover, so trim the worst of them off. New growth should come in normally within a week or two."],
      opts:[{l:"Done — what should I look for?",to:"c_light_fix",cls:"primary"}]},
  ja:{t:"光の当てすぎです。暗い時間をつくってください",
      p:["白いタイマー側面のスイッチを下げて <span class=\"kbd\">タイマー</span> に戻し、設定どおりに動作させてください。",
         "その上で、1日12時間になるようダイヤルを設定します。8時間を下回らず、14時間を超えないようにしてください。ピン1本が15分で、押し下げたピンの範囲が点灯時間です。連続でも、朝6時間・夕方6時間のように分けても構いません。",
         "傷んだ葉は元に戻らないため、ひどいものは摘み取ってください。1〜2週間で新しい葉が正常に育ってきます。"],
      opts:[{l:"完了 — 次に何を見ればいいですか？",to:"c_light_fix",cls:"primary"}]}
},

c_light_fix:{
  path:{en:"Check back",ja:"経過確認"},
  en:{t:"Give it a week, then check the new leaves",
      p:["Watch the <strong>new growth</strong> at the center of each plant, not the leaves that were already damaged — those won't turn green again.",
         "After about a week, new leaves should be coming in tender and evenly colored. Come back to this page then and tell us which it is."],
      opts:[
        {l:"New growth looks healthy",to:"done_generic"},
        {l:"No change after a week",to:"g_nutrient"}
      ]},
  ja:{t:"1週間ほど様子を見て、新しい葉を確認してください",
      p:["既に傷んだ葉ではなく、株の中心から出てくる<strong>新しい葉</strong>を観察してください。傷んだ葉が緑に戻ることはありません。",
         "1週間ほどで、柔らかく均一な色の新葉が育ってくるはずです。その時点でこのページに戻り、結果をお選びください。"],
      opts:[
        {l:"新しい葉は健康そうです",to:"done_generic"},
        {l:"1週間経っても変化がありません",to:"g_nutrient"}
      ]}
},

g_nutrient:{
  path:{en:"Growth · 5",ja:"生育 · 5"},
  en:{t:"Do you add nutrients when you add water?",
      p:["Nutrient A and Nutrient B should go in with every top-off, not only with full refills. Water on its own dilutes the solution a little each time, and the plants slowly run short."],
      opts:[
        {l:"Yes, every single time",to:"g_service"},
        {l:"No, or only sometimes",to:"n_crop",resume:"c_nutrient"}
      ]},
  ja:{t:"給水のたびに肥料を加えていますか？",
      p:["肥料AとBは、満水にするときだけでなく足し水のたびに加える必要があります。水だけを足すと少しずつ養液が薄まり、やがて肥料不足になります。"],
      opts:[
        {l:"はい、毎回加えています",to:"g_service"},
        {l:"いいえ、または時々です",to:"n_crop",resume:"c_nutrient"}
      ]}
},

c_nutrient:{
  path:{en:"Check back",ja:"経過確認"},
  en:{t:"Dose it correctly and give it a week",
      p:["Add the right dose now, and then with every top-off from here on. Underfed plants green up noticeably within about a week once the balance is restored.",
         "Watch the new growth at the center of each plant. Come back to this page in a week and tell us which it is."],
      opts:[
        {l:"Better — the plants are greening up",to:"done_generic"},
        {l:"No change after a week",to:"g_service"}
      ]},

      p:["今すぐ適量を加え、以降は足し水のたびに必ず加えてください。肥料不足の株は、バランスが戻れば1週間ほどで目に見えて緑が濃くなります。",
         "株の中心から出る新しい葉を観察してください。1週間後にこのページへ戻り、結果をお選びください。"],
      opts:[
        {l:"改善しています — 緑が濃くなってきました",to:"done_generic"},
        {l:"1週間経っても変化がありません",to:"g_service"}
      ]}
},

g_service:{
  path:{en:"Growth · 6",ja:"生育 · 6"},
  en:{t:"When did we last service this tower?",
      p:["Even with the right dose going in, pH and nutrient balance drift over time. Three months is about as long as we like to leave a tower between checks. A service visit means testing the nutrient level and pH, changing the reservoir water and cleaning the unit."],
      opts:[
        {l:"Less than 3 months ago",to:"contact",note:"Water, pests, light and nutrients all check out. Serviced within the last 3 months."},
        {l:"More than 3 months ago, or I'm not sure",to:"g_book",cls:"primary"}
      ]},
  ja:{t:"前回のメンテナンスはいつでしたか？",
      p:["適量の肥料を入れていても、pHと養分バランスは時間とともにずれていきます。点検の間隔は3か月を上限と考えています。メンテナンスでは、養液濃度とpHの測定、貯水タンクの水の交換、本体の清掃を行います。"],
      opts:[
        {l:"3か月以内です",to:"contact",note:"Water, pests, light and nutrients all check out. Serviced within the last 3 months."},
        {l:"3か月以上前、または分かりません",to:"g_book",cls:"primary"}
      ]}
},

g_book:{

         "訪問までの間も、足し水のたびに肥料を加え続けてください。"],
      opts:[{l:"訪問を依頼する",to:"contact",cls:"primary",note:"Requests a service visit — last service over 3 months ago."}]}
},

l_plugs:{
  path:{en:"Lights · 1",ja:"ライト · 1"},
  banner:{kind:"stop",
    en:"Don't touch the dial on the light unit itself. It's set to always-on deliberately.",
    ja:"ライト本体のダイヤルには触れないでください。意図的に常時オンに設定しています。"},
  photos:[["octopus","The dial built into the light head — leave this exactly as it is.","ライト本体に内蔵されたダイヤル。この状態のまま触れないでください。"],
          ["ltOutlet","The white timer near the outlet does all the scheduling.","コンセント付近の白いタイマーが点灯時間を制御しています。"]],
  en:{t:"Check the octopus light and the plugs",
      p:["If your lights are the <strong>octopus type</strong> that sprouts from the top of the tower, the head has a dial and switches of its own. We set it to always-on at installation, because its built-in timer doesn't keep time on Tokyo's 50 Hz supply. Leave that dial alone — all the scheduling is done by the separate white timer near the wall outlet.",
         "Do check that the octopus's own switches are all still on, then push every plug home: the lights into the white timer, the timer into the outlet, and the power strip switched on."],
      opts:[
        {l:"All pushed in — still no light",to:"l_manual"},
        {l:"They came on when I pushed a plug in",to:"done_lights"}
      ]},
  ja:{t:"ライト本体と電源の接続を確認してください",
      p:["タワー上部から枝分かれした<strong>タコ足型（オクトパス）</strong>のライトの場合、ヘッド部分に独自のダイヤルとスイッチが付いています。内蔵タイマーは東京の50Hz電源では正確に動作しないため、設置時に常時オンへ設定しています。このダイヤルには触れないでください。点灯時間の制御は、コンセント付近の白いタイマーが行っています。",
         "本体側のスイッチがすべてオンのままか確認したうえで、各プラグをしっかり差し込んでください。ライト → 白いタイマー、タイマー → コンセント、そして電源タップのスイッチ。"],
      opts:[
        {l:"すべて差し直しましたが点きません",to:"l_manual"},
        {l:"差し直したら点灯しました",to:"done_lights"}
      ]}
},

  en:{t:"Force the lights on by hand",
      p:["Find the switch on the <strong>side</strong> of the white timer. Slide it up from <span class=\"kbd\">タイマー</span> (timer) to <span class=\"kbd\">常時通電</span> (always on). That bypasses the schedule and powers the outlet right now.",

      opts:[

      ]},
  ja:{t:"手動でライトを点灯させてみてください",
      p:["白いタイマーの<strong>側面</strong>にあるスイッチを探してください。<span class=\"kbd\">タイマー</span> から <span class=\"kbd\">常時通電</span> へ上げます。これで設定を無視して、その場で通電されます。",
         "ライトは点灯しますか？"],
      opts:[
        {l:"はい、点灯しました",to:"l_reset"},
        {l:"いいえ、点きません",to:"l_bypass"}
      ]}
},

l_reset:{
  path:{en:"Lights · 3",ja:"ライト · 3"},
  photos:[["ltDial","The red 現在時刻 arrow must point at the real time now. Turn the dial clockwise only.","赤い「現在時刻」の矢印が実際の時刻を指すようにします。ダイヤルは時計回りにのみ回してください。"]],
  en:{t:"The lights work — it's the schedule",
      p:["Slide the side switch back down to <span class=\"kbd\">タイマー</span>, then check two things on the dial:",
         "<strong>The clock.</strong> The red <span class=\"kbd\">現在時刻</span> arrow should point at the actual time right now. If it's wrong, turn the dial <strong>clockwise only</strong> until it lines up — that alone explains lights coming on at the wrong hour, or not at all.",
         "<strong>The hours.</strong> Each pin is 15 minutes, and the pins pushed down are when the lights run. They should add up to 12 hours a day — never under 8, never over 14."],
      opts:[{l:"Set — continue",to:"@resume",cls:"primary",fallback:"c_lights"}]},
  ja:{t:"ライトは正常です。設定の問題です",
      p:["側面のスイッチを <span class=\"kbd\">タイマー</span> に戻し、ダイヤルの2点を確認してください。",
         "<strong>時刻。</strong>赤い <span class=\"kbd\">現在時刻</span> の矢印が、今の実際の時刻を指しているか確認します。ずれている場合は、<strong>時計回りにのみ</strong>回して合わせてください。点灯時刻がずれる、まったく点かないといった症状は、これだけが原因のこともよくあります。",
         "<strong>点灯時間。</strong>ピン1本が15分で、押し下げたピンの範囲が点灯時間です。合計が1日12時間になるようにしてください。8時間未満、14時間超はいずれも避けてください。"],
      opts:[{l:"設定しました — 次へ",to:"@resume",cls:"primary",fallback:"c_lights"}]}
},

/* ---------------- TIP BURN / AIRFLOW ---------------- */
t_check:{
  path:{en:"Leaf tips · 1",ja:"葉先 · 1"},
  en:{t:"Two things cause burnt leaf tips",
      p:["Brown, crispy or curled leaf tips come from either <strong>too much light</strong> or <strong>too little airflow</strong>. They look almost identical on the plant, so the quickest way to tell them apart is to check the light schedule — that's a fact you can read off the timer.",
         "Look at the white light timer. Is the side switch on <span class=\"kbd\">常時通電</span> (always on), or do the pins add up to more than 14 hours a day?"],
      opts:[
        {l:"Yes — the lights run long, or always-on",to:"g_light_fix"},
        {l:"No — the lights are on a normal schedule",to:"g_airflow"},
        {l:"This is an outdoor tower, no lights",to:"g_airflow"}
      ]},
  ja:{t:"葉先が傷む原因は2つあります",
      p:["葉先が茶色くパリパリになる、または丸まる症状は、<strong>光の当てすぎ</strong>か<strong>風通しの悪さ</strong>のどちらかが原因です。見た目がほぼ同じなので、タイマーで確認できる点灯時間から切り分けるのが最も確実です。",
         "白いライトタイマーをご確認ください。側面のスイッチが <span class=\"kbd\">常時通電</span> になっていませんか。また、ピンの合計が1日14時間を超えていませんか。"],
      opts:[
        {l:"はい — 長時間点灯、または常時通電です",to:"g_light_fix"},
        {l:"いいえ — 通常の設定どおりです",to:"g_airflow"},
        {l:"屋外タワーでライトはありません",to:"g_airflow"}
      ]}
},

g_airflow:{
  path:{en:"Leaf tips · 2",ja:"葉先 · 2"},
  banner:{kind:"warn",
    en:"This is tip burn. It's an air problem, not a water or nutrient problem.",
    ja:"チップバーン（葉先枯れ）です。水や肥料ではなく、空気の問題です。"},
  en:{t:"The plants need moving air",
      p:["Tip burn shows up when air sits still around the leaves, and warm room air makes it worse. It's mostly an indoor problem: the plants are growing fast, the canopy is dense, and there isn't enough air exchange to keep up. Outdoors it's rare, which is why we ask for a sunny, <strong>well-ventilated</strong> spot — moving air dries the leaves and holds down pests and powdery mildew at the same time.",
         "Three things help, in the order most people find easiest:",
         "<strong>1. Move the air.</strong> A small fan on its lowest setting, pointed near the tower rather than straight at it, is usually enough. The leaves should stir gently.<br><strong>2. Bring the temperature down.</strong> Air conditioning or an open window during the warm part of the day.<br><strong>3. Thin the plants.</strong> A dense canopy traps its own air. Harvesting opens it up, and it's the fastest of the three.",
         "Already-burnt tips won't heal. Judge it by the new leaves."],
      opts:[
        {l:"Show me how to thin it",to:"harvest",resume:"c_airflow",cls:"primary"},
        {l:"I'll add a fan — what should I look for?",to:"c_airflow"}
      ]},
  ja:{t:"植物には動く空気が必要です",
      p:["チップバーンは、葉のまわりの空気が動かないときに起こり、室温が高いと悪化します。主に屋内で起こる問題です。株が旺盛に育って葉が密集し、空気の入れ替えが追いつかなくなるためです。屋外ではほとんど起こりません。日当たりと<strong>風通し</strong>の良い場所をお願いしているのはこのためで、空気が動くと葉が乾き、害虫やうどんこ病の発生も抑えられます。",
         "対策は3つあります。取り組みやすい順に挙げます。",
         "<strong>1. 空気を動かす。</strong>小型の扇風機を最弱で、タワーに直接ではなく近くに向けて回すだけで十分です。葉がそよぐ程度が目安です。<br><strong>2. 室温を下げる。</strong>日中の暑い時間帯にエアコンを使うか、窓を開けてください。<br><strong>3. 株を間引く。</strong>葉が密集すると空気がこもります。収穫して風の通り道をつくるのが、3つの中で最も即効性があります。",
         "すでに傷んだ葉先は元に戻りません。新しい葉で判断してください。"],
      opts:[
        {l:"間引き方を見る",to:"harvest",resume:"c_airflow",cls:"primary"},
        {l:"扇風機を用意します — 次に何を見ればいいですか？",to:"c_airflow"}
      ]}
},

c_airflow:{
  path:{en:"Check back",ja:"経過確認"},
  en:{t:"Give it a week or two",
      p:["Watch the <strong>new leaves</strong> coming out of the center of each plant. If the air is moving well enough now, they'll come in with clean, soft edges.",
         "Trim the worst of the burnt tips off in the meantime — they're not going to recover, and removing them makes it much easier to see whether the problem has stopped."],
      opts:[
        {l:"New leaves are coming in clean",to:"done_generic"},
        {l:"New leaves are burning too",to:"contact",note:"TIP BURN persists after improving airflow. Lights confirmed on a normal schedule."}
      ]},
  ja:{t:"1〜2週間ほど様子を見てください",
      p:["株の中心から出てくる<strong>新しい葉</strong>を観察してください。空気が十分に動いていれば、縁がきれいで柔らかい葉が育ってきます。",
         "その間に、傷んだ葉先は摘み取っておいてください。回復することはなく、取り除いておくと症状が止まったかどうかを判断しやすくなります。"],
      opts:[
        {l:"新しい葉はきれいに育っています",to:"done_generic"},
        {l:"新しい葉も傷んでいます",to:"contact",note:"TIP BURN persists after improving airflow. Lights confirmed on a normal schedule."}
      ]}
},

/* ---------------- HOW-TO ---------------- */
harvest:{
  path:{en:"Harvesting",ja:"収穫"},
  photos:[["tower","Harvest the outer leaves and leave the center of each plant intact.","外側の葉から収穫し、株の中心部は残してください。"]],
  banner:{kind:"good",
    en:"Take a third of the plant, half at the very most. What you leave behind is what grows back.",
    ja:"1回の収穫は株の3分の1まで、多くても半分までです。残した葉が次の生長をつくります。"},
  en:{t:"Cut and come again",
      p:["These plants are harvested over and over rather than pulled up once. Done properly, one planting keeps producing for months.",
         "<strong>How much.</strong> Take about a third of the plant in any one harvest, and never more than half. Strip it too hard and it has no leaves left to power new growth, so it stalls instead of bouncing back.",
         "<strong>How often.</strong> Roughly once a week, sometimes more when everything is growing fast.",
         "<strong>Where to cut.</strong> Work from the outside in. Take the <strong>outer, older leaves</strong> and cut each one at its base, close to the stem. Leave the <strong>center stalk and the young leaves at the heart of the plant</strong> completely alone — that growing point is the whole engine, and cutting it ends the plant's productive life.",
         "Clean the tower and reservoir after each harvest."],
      opts:[{l:"Got it",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"How do I clean it?",to:"cleaning"}]},
  ja:{t:"かき取り収穫（カット＆カムアゲイン）",
      p:["これらの野菜は、一度に引き抜くのではなく、繰り返し収穫します。正しく行えば、一度の植え付けで数か月にわたって収穫できます。",
         "<strong>収穫量。</strong>1回の収穫で株の約3分の1、多くても半分までにしてください。採りすぎると生長に必要な葉が残らず、回復せずに生育が止まってしまいます。",
         "<strong>頻度。</strong>おおむね週1回。生育が旺盛な時期はもう少し頻繁でも構いません。",
         "<strong>切る場所。</strong>外側から内側へ向かって収穫します。<strong>外側の古い葉</strong>を選び、茎の近くの付け根で切ってください。<strong>中心の茎と、株の中心にある若い葉</strong>には手を触れないでください。この生長点が株の要であり、切ってしまうと以後は収穫できなくなります。",
         "収穫のたびに、タワーと貯水タンクを清掃してください。"],
      opts:[{l:"わかりました",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"清掃方法を見る",to:"cleaning"}]}
},

cleaning:{
  path:{en:"Cleaning",ja:"清掃"},
  en:{t:"Cleaning the tower with citric acid",
      p:["Clean the tower and reservoir after every harvest. Mineral scale and residue build up steadily, and citric acid lifts them off without anything harsh going near the roots.",
         "<strong>What to use.</strong> Food-grade, non-GMO citric acid.",
         "<strong>How.</strong> Put <strong>3 to 4 cups</strong> of citric acid into the reservoir, then fill it with water. Submerge the parts that need cleaning and leave them for a few hours. That does most of the work for you — dirt and residue come away with very little scrubbing.",
         "Rinse everything with clean water before you refill the reservoir and add fresh nutrients.",
         "Greentopia will handle this for you as a service if you'd rather not — just ask."],
      opts:[{l:"Got it",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"Have Greentopia do it",to:"contact",note:"Requests a tower cleaning service visit."}]},
  ja:{t:"クエン酸によるタワーの清掃",
      p:["収穫のたびに、タワーと貯水タンクを清掃してください。ミネラルの付着や汚れは少しずつ蓄積します。クエン酸なら、根に刺激の強い薬剤を使わずに落とせます。",
         "<strong>使用するもの。</strong>食品グレード・非遺伝子組換えのクエン酸。",
         "<strong>手順。</strong>クエン酸を<strong>3〜4カップ</strong>貯水タンクに入れ、水で満たします。清掃したい部品を浸し、数時間置いてください。これだけでほとんどの汚れが浮き上がり、ほとんど擦らずに落とせます。",
         "清掃後は、きれいな水でよくすすいでから、水と肥料を入れ直してください。",
         "ご希望であれば、Greentopiaが清掃サービスとして承ります。お気軽にご連絡ください。"],
      opts:[{l:"わかりました",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"Greentopiaに清掃を依頼する",to:"contact",note:"Requests a tower cleaning service visit."}]}
},

ref_lights:{
  path:{en:"Light settings",ja:"ライトの設定"},
  photos:[["ltDial","Each pin is 15 minutes. The red 現在時刻 arrow shows the current time.","ピン1本が15分です。赤い「現在時刻」の矢印が現在時刻を示します。"]],
  banner:{kind:"good",
    en:"12 hours a day. Never under 8, never over 14.",
    ja:"1日12時間。8時間未満、14時間超はいずれも避けてください。"},
  en:{t:"How long the lights should run",
      p:["Indoor towers only — outdoor towers get what they need from the sun.",
         "<strong>The time of day doesn't matter.</strong> The lights are bright, so if they're intrusive at dinner or in the evening, run them overnight or while you're out. The plants don't mind, as long as the daily total is there. You can split it too: six hours morning, six hours evening.",
         "<strong>Setting the dial.</strong> Each pin is 15 minutes, and the pins pushed down are the hours the lights run. The red <span class=\"kbd\">現在時刻</span> arrow must point at the actual time right now — turn the dial <strong>clockwise only</strong> to correct it. Keep the side switch on <span class=\"kbd\">タイマー</span>.",
         "If your lights are the octopus type on top of the tower, leave the dial on the light head itself alone. It's set to always-on deliberately, because its own timer doesn't keep time on Tokyo's 50 Hz supply."],
      opts:[{l:"Got it",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"My lights aren't coming on",to:"l_plugs"}]},
  ja:{t:"ライトの点灯時間",
      p:["屋内タワー専用です。屋外タワーは太陽光で十分です。",
         "<strong>時間帯は自由です。</strong>ライトはかなり明るいため、夕食時や夜間に気になる場合は、就寝中や外出中に点灯させて構いません。1日の合計時間が確保できていれば植物に影響はありません。朝6時間・夕方6時間のように分けることもできます。",
         "<strong>ダイヤルの設定。</strong>ピン1本が15分で、押し下げたピンの範囲が点灯時間です。赤い <span class=\"kbd\">現在時刻</span> の矢印は、必ず今の実際の時刻を指すようにしてください。修正する際は<strong>時計回りにのみ</strong>回します。側面のスイッチは <span class=\"kbd\">タイマー</span> のままにしてください。",
         "タワー上部のタコ足型ライトをお使いの場合、ライト本体のダイヤルには触れないでください。内蔵タイマーは東京の50Hz電源では正確に動作しないため、意図的に常時オンへ設定しています。"],
      opts:[{l:"わかりました",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"ライトが点灯しません",to:"l_plugs"}]}
},

ref_pump:{
  path:{en:"Pump settings",ja:"ポンプの設定"},
  photos:[["pumpI","Indoor: I.","屋内：I"],["pumpO","Outdoor: O.","屋外：O"]],
  en:{t:"What the pump timer should show",
      p:["<strong>Indoor tower: <span class=\"kbd\">I</span>.</strong> The pump runs 5 minutes on, 40 minutes off, around the clock.",
         "<strong>Outdoor tower: <span class=\"kbd\">O</span>.</strong> The pump runs 3 minutes on, 12 minutes off, around the clock. Outdoor towers water more often because wind and sun dry the plants out faster.",
         "Leave the timer plugged in at all times. Each press of the round button switches between I and O and restarts that cycle from the beginning — there's no off position.",
         "<strong>If the wrong letter is showing</strong>, a power interruption has most likely reset it. Press the button until the right one appears. It's worth checking after any blackout or after the tower has been unplugged and moved."],
      opts:[{l:"Got it",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"My pump isn't running",to:"w_pump"}]},
  ja:{t:"ポンプタイマーの正しい表示",
      p:["<strong>屋内タワー：<span class=\"kbd\">I</span></strong>　ポンプは5分運転・40分停止を24時間くり返します。",
         "<strong>屋外タワー：<span class=\"kbd\">O</span></strong>　ポンプは3分運転・12分停止を24時間くり返します。屋外タワーは風と日差しで乾きやすいため、散水の頻度が高く設定されています。",
         "電源プラグは常に差したままにしてください。丸いボタンを押すたびにIとOが切り替わり、そのサイクルが最初からやり直しになります。「切」の位置はありません。",
         "<strong>表示が違う場合</strong>は、停電などでリセットされた可能性があります。正しい文字が表示されるまでボタンを押してください。停電の後や、タワーの電源を抜いて移動した後は必ずご確認ください。"],
      opts:[{l:"わかりました",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"ポンプが動きません",to:"w_pump"}]}
},

away:{
  path:{en:"Time away",ja:"長期不在"},
  banner:{kind:"warn",
    en:"Never let the tower run dry. Once the water is gone, the plants may have only a few hours.",
    ja:"絶対に水を切らさないでください。水がなくなると、植物に残された時間は数時間しかありません。"},
  en:{t:"Leaving the tower for a while",
      p:["<strong>How fast it drinks.</strong> A tower full of large, mature plants gets through far more water than a freshly planted one. Outdoors in summer, heat, sun and wind together can empty a reservoir in a couple of days.",
         "<strong>A few days.</strong> Fill the reservoir right before you go and it will usually see you through. Check the level the day you leave rather than assuming.",
         "<strong>Longer than that.</strong> Ask a neighbor to top it up with the 5 L jug while you're away — plain water is fine if nutrients are too much to explain. Or let us know in advance and we'll arrange something.",
         "<strong>Worth doing first.</strong> Harvest before you leave. A thinned tower drinks noticeably less, and you get the greens rather than coming home to plants that have bolted.",
         "For outdoor installations we can sometimes fit an automated irrigation system. Ask us if that would help."],
      opts:[{l:"Got it",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"Tell Greentopia I'll be away",to:"contact",note:"Customer will be away \u2014 asking about cover for watering."}]},
  ja:{t:"長期間タワーを空けるとき",
      p:["<strong>水の減り方。</strong>株が大きく育ったタワーは、植え付け直後よりはるかに多くの水を消費します。夏場の屋外では、暑さ・日差し・風が重なり、数日で貯水タンクが空になることもあります。",
         "<strong>数日間の場合。</strong>出発直前に満水にしておけば、通常はそれで足ります。推測せず、出発当日に必ず水位を確認してください。",
         "<strong>それ以上の場合。</strong>ご近所の方に、5Lジャグでの補充をお願いしてください。肥料の説明が難しければ、水だけでも構いません。または事前にご連絡いただければ、こちらで対応を検討します。",
         "<strong>出発前におすすめ。</strong>収穫してから出かけてください。株を間引いたタワーは水の消費が目に見えて減りますし、収穫物も無駄になりません。",
         "屋外の設置環境によっては、自動潅水システムの導入が可能な場合があります。ご興味があればご相談ください。"],
      opts:[{l:"わかりました",to:"@resume",cls:"primary",fallback:"done_info"},
            {l:"不在をGreentopiaに伝える",to:"contact",note:"Customer will be away \u2014 asking about cover for watering."}]}
},

      ]},
  ja:{t:"他にご用件はありますか？",
      p:["別の項目をお調べの場合は最初に戻ってください。ここに載っていないことは、お気軽にご連絡ください。"],
      opts:[
        {l:"最初に戻る",to:"@restart",cls:"primary"},

      ]}
},

/* ---------- engine ---------- */
const EMAIL = "info@greentopia.jp";
let lang = "en";
let stack = [];
let current = "start";
let resume = null;
let state = {};
let notes = [];
let noteText = "";

const stage = document.getElementById("stage");
const foot  = document.getElementById("foot");

try{ const s = localStorage.getItem("gt_lang"); if(s==="ja"||s==="en") lang = s; }catch(e){}

function setLang(l){
  lang = l;
  try{ localStorage.setItem("gt_lang", l); }catch(e){}
  document.documentElement.lang = (l==="ja" ? "ja" : "en");
  document.getElementById("lang-en").setAttribute("aria-pressed", String(l==="en"));
  document.getElementById("lang-ja").setAttribute("aria-pressed", String(l==="ja"));
  document.getElementById("brandsub").textContent = UI[l].sub;
  render();
}
document.getElementById("lang-en").addEventListener("click",()=>setLang("en"));
document.getElementById("lang-ja").addEventListener("click",()=>setLang("ja"));

function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html!=null) n.innerHTML = html;
  return n;
}
function stripTags(s){ const d=document.createElement("div"); d.innerHTML=s; return (d.textContent||"").trim(); }

const ICONS = {
  warn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.6 1.9 21h20.2L12 3.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.6v4.6M12 17.4h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  stop:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8.4 8.4l7.2 7.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  good:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.3l2.6 2.6L16 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const CHEV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function summaryText(){
  const lines = stack.map((s,i)=> (i+1)+". "+s.label);
  notes.forEach(n=> lines.push("! "+n));
  return lines.join("\n");
}

function render(){
  const n = T[current];
  const c = n[lang];
  stage.innerHTML = "";
  stage.appendChild(el("div","eyebrow", n.path[lang]));
  stage.appendChild(el("h1",null,c.t));
  if(c.lede) stage.appendChild(el("p","lede",c.lede));

  if(n.banner){
    const b = el("div","banner "+n.banner.kind);
    b.appendChild(el("span","ico",ICONS[n.banner.kind]));
    b.appendChild(el("span",null,n.banner[lang]));
    stage.appendChild(b);
  }

  if(c.p && c.p.length){
    const pr = el("div","prose");
    c.p.forEach(t=> pr.appendChild(el("p",null,t)));
    stage.appendChild(pr);
  }

  if(n.photos && n.photos.length){
    const g = el("div","photos"+(n.photos.length>1?" two":""));
    n.photos.forEach(([k,ce,cj])=>{
      if(!IMG[k]) return;
      const f = el("figure");
      const im = document.createElement("img");
      im.src = IMG[k]; im.alt = (lang==="ja"?cj:ce); im.loading = "lazy";
      f.appendChild(im);
      f.appendChild(el("figcaption",null,lang==="ja"?cj:ce));
      g.appendChild(f);
    });
    stage.appendChild(g);
  }

  if(n.contact) renderContact();

  if(c.opts && c.opts.length){
    const box = el("div","opts");
    c.opts.forEach((o,i)=>{
      if(o.head){ box.appendChild(el("div","optgroup",o.head)); return; }
      const b = el("button","opt"+(o.cls?" "+o.cls:""));
      b.type = "button";
      b.appendChild(el("span","txt",o.l));
      b.appendChild(el("span","chev",CHEV));
      b.addEventListener("click",()=>choose(current,i));
      box.appendChild(b);
    });
    stage.appendChild(box);
  }

  const nav = el("div","nav");
  if(stack.length){
    const back = el("button","navbtn",UI[lang].back);
    back.type="button"; back.addEventListener("click",goBack);
    nav.appendChild(back);
    const re = el("button","navbtn",UI[lang].restart);
    re.type="button"; re.addEventListener("click",restart);
    nav.appendChild(re);
  }
  if(nav.children.length) stage.appendChild(nav);

  if(stack.length && !n.contact){
    const d = el("details","trail");
    d.appendChild(el("summary",null,UI[lang].trail));
    const ol = el("ol");
    stack.forEach(s=> ol.appendChild(el("li",null,s.shown)));
    d.appendChild(ol);
    stage.appendChild(d);
  }

  foot.innerHTML = UI[lang].foot.replace(EMAIL,'<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>');
  window.scrollTo({top:0,behavior:"instant"});
}

function renderContact(){
  const box = el("div");

  box.appendChild(el("div","fieldlabel", lang==="ja" ? "確認済みの内容" : "What you checked"));
  const auto = document.createElement("textarea");
  auto.className = "box readonly"; auto.id = "gt-auto"; auto.readOnly = true;
  auto.value = summaryText() || (lang==="ja" ? "（なし）" : "(none)");
  box.appendChild(auto);

  box.appendChild(el("div","fieldlabel", lang==="ja" ? "あなたからの情報" : "Your details and notes"));
  box.appendChild(el("p","hint", lang==="ja"
    ? "お名前と設置場所をご記入ください。気づいたことがあれば何でもお書きください。"
    : "Add your name and where the tower is. Anything else you've noticed is helpful too."));
  const note = document.createElement("textarea");
  note.className = "box note"; note.id = "gt-note";
  note.value = noteText || (lang==="ja"
    ? "お名前：\n設置場所：\nタワー：屋内 / 屋外\n\n補足："
    : "Name:\nLocation:\nTower: indoor / outdoor\n\nAnything else:");
  box.appendChild(note);

  const row = el("div","mailrow");
  const a = document.createElement("a");
  a.className = "opt primary"; a.id = "gt-mail";
  a.style.textDecoration = "none"; a.style.justifyContent = "center";
  a.textContent = lang==="ja" ? "メールを作成する" : "Open an email";
  row.appendChild(a);
  box.appendChild(row);

  const hint = el("p","hint", lang==="ja"
    ? 'メールが開かない場合は、上の内容をコピーして <a class="linkish" href="mailto:'+EMAIL+'">'+EMAIL+'</a> 宛にお送りください。'
    : 'If that doesn\'t open your mail app, copy the text above and send it to <a class="linkish" href="mailto:'+EMAIL+'">'+EMAIL+'</a>.');
  hint.style.marginTop = "12px";
  box.appendChild(hint);

  stage.appendChild(box);

  function refresh(){
    noteText = note.value;
    const subject = lang==="ja" ? "タワーのサポート依頼" : "Tower support request";
    const body = noteText + "\n\n"
      + (lang==="ja" ? "--- 確認済みの内容 ---\n" : "--- Checks completed ---\n")
      + auto.value;
    a.href = "mailto:"+EMAIL+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  }
  note.addEventListener("input", refresh);
  refresh();
}

function choose(nodeId, idx){
  const node = T[nodeId];
  const optEN = node.en.opts[idx];
  const optCur = node[lang].opts[idx];

  if(optEN.to === "@restart"){ restart(); return; }

  stack.push({
    node: nodeId,
    resume: resume,
    state: Object.assign({}, state),
    notesLen: notes.length,
    label: stripTags(node.en.t) + " — " + stripTags(optEN.l),
    shown: stripTags(node[lang].t) + " — " + stripTags(optCur.l)
  });
  if(optEN.note) notes.push(optEN.note);
  if(optEN.resume) resume = optEN.resume;
  if(optEN.set) Object.assign(state, optEN.set);

  let to = optEN.to;
  if(to === "@resume"){
    to = resume || optEN.fallback || "contact";
    resume = null;
  } else if(to.indexOf("@state.") === 0){
    to = state[to.slice(7)] || optEN.fallback || "contact";
  }
  current = T[to] ? to : "contact";
  render();
}

function goBack(){
  const prev = stack.pop();
  if(!prev) return;
  notes = notes.slice(0, prev.notesLen);
  resume = prev.resume;
  state = Object.assign({}, prev.state);
  current = prev.node;
  render();
}

function restart(){
  stack=[]; notes=[]; resume=null; state={}; noteText=""; current="start"; render();
}

setLang(lang);
</script>
