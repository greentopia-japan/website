<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="../G_only.png">
<title>Tower First Aid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
:root{
  --paper:#F5F7F2; --surface:#FFFFFF; --surface-2:#EBEFE6;
  --ink:#14201A; --muted:#5C6B62; --line:#DBE2D6;
  --accent:#1E6B47; --accent-soft:#E2EFE7; --accent-ink:#115334; --on-accent:#FFFFFF;
  --warn:#9C5300; --warn-soft:#FAEDDA; --warn-line:#E7C99B;
  --danger:#A33226; --danger-soft:#F9E6E3; --danger-line:#E6B7B0;
  --shadow:0 1px 2px rgba(20,32,26,.05), 0 10px 26px rgba(20,32,26,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1411; --surface:#172019; --surface-2:#212B24;
    --ink:#E7EFE8; --muted:#9BAAA0; --line:#2C362E;
    --accent:#52BE87; --accent-soft:#16301F; --accent-ink:#8FDCB2; --on-accent:#0E1411;
    --warn:#E3A459; --warn-soft:#2C2317; --warn-line:#4A3A20;
    --danger:#E9867A; --danger-soft:#31201D; --danger-line:#4E2E29;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1411; --surface:#172019; --surface-2:#212B24;
  --ink:#E7EFE8; --muted:#9BAAA0; --line:#2C362E;
  --accent:#52BE87; --accent-soft:#16301F; --accent-ink:#8FDCB2; --on-accent:#0E1411;
  --warn:#E3A459; --warn-soft:#2C2317; --warn-line:#4A3A20;
  --danger:#E9867A; --danger-soft:#31201D; --danger-line:#4E2E29;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  font-size:16px; line-height:1.62; -webkit-text-size-adjust:100%;
}
h1,h2,.brand-name{font-family:"Zilla Slab","Noto Sans JP",Georgia,serif; text-wrap:balance}

.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topbar-in{max-width:620px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.leafmark{flex:0 0 auto}
.brand-name{font-weight:700; font-size:15px; letter-spacing:.01em; white-space:nowrap}
.brand-sub{font-size:11px; color:var(--muted); letter-spacing:.09em; text-transform:uppercase; white-space:nowrap}
.spacer{flex:1 1 auto}
.langtoggle{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface)}
.langtoggle button{
  font:inherit; font-size:12px; font-weight:600; padding:6px 11px; border:0; cursor:pointer;
  background:transparent; color:var(--muted); line-height:1.3;
}
.langtoggle button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}

.wrap{max-width:620px; margin:0 auto; padding:20px 16px 48px}

.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 20px}
.card h1{font-size:1.42rem; line-height:1.28; margin:0 0 12px; font-weight:700}
.lede{color:var(--muted); font-size:.95rem; margin:0 0 18px}
.prose p{margin:0 0 14px}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:700}
.kbd{font-weight:700; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:1px 7px; white-space:nowrap}

.banner{display:flex; gap:11px; align-items:flex-start; border-radius:10px; padding:12px 14px; margin:0 0 18px; font-size:.93rem; line-height:1.55}
.banner .ico{flex:0 0 auto; margin-top:2px}
.banner.warn{background:var(--warn-soft); border:1px solid var(--warn-line); color:var(--ink)}
.banner.warn .ico{color:var(--warn)}
.banner.stop{background:var(--danger-soft); border:1px solid var(--danger-line); color:var(--ink)}
.banner.stop .ico{color:var(--danger)}
.banner.good{background:var(--accent-soft); border:1px solid var(--line); color:var(--ink)}
.banner.good .ico{color:var(--accent)}

.photos{display:grid; gap:12px; margin:18px 0 4px}
.photos.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:359px){.photos.two{grid-template-columns:1fr}}
figure{margin:0}
figure img{
  display:block; width:100%; max-width:100%; height:auto; max-height:330px; object-fit:contain;
  border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
}
figcaption{font-size:.8rem; color:var(--muted); margin-top:6px; line-height:1.45}

.opts{display:flex; flex-direction:column; gap:10px; margin-top:22px}
.opt{
  font:inherit; font-size:.98rem; font-weight:500; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:12px; min-height:54px;
  padding:13px 15px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); transition:border-color .12s, background .12s, transform .06s;
}
.opt:hover{border-color:var(--accent); background:var(--accent-soft)}
.opt:active{transform:translateY(1px)}
.opt .txt{flex:1 1 auto}
.opt .chev{flex:0 0 auto; color:var(--muted)}
.opt:hover .chev{color:var(--accent)}
.opt.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}
.opt.primary .chev{color:var(--on-accent); opacity:.75}
.opt.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink); color:var(--surface)}
.opt.quiet{color:var(--muted)}
.optgroup{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  color:var(--muted); margin:10px 0 -2px 2px;
}
.optgroup:first-child{margin-top:0}
.opt:focus-visible, .langtoggle button:focus-visible, .navbtn:focus-visible, .linkish:focus-visible, textarea:focus-visible{
  outline:2.5px solid var(--accent); outline-offset:2px;
}

.nav{display:flex; gap:10px; align-items:center; margin-top:20px; flex-wrap:wrap}
.navbtn{
  font:inherit; font-size:.88rem; font-weight:600; cursor:pointer;
  background:transparent; border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:8px 15px;
}
.navbtn:hover{color:var(--ink); border-color:var(--muted)}

details.trail{margin-top:18px; border-top:1px solid var(--line); padding-top:14px}
details.trail summary{cursor:pointer; font-size:.83rem; color:var(--muted); font-weight:600; letter-spacing:.04em; list-style:none}
details.trail summary::-webkit-details-marker{display:none}
details.trail summary::before{content:"▸ "}
details.trail[open] summary::before{content:"▾ "}
.trail ol{margin:12px 0 0; padding:0 0 0 18px; font-size:.86rem; color:var(--muted); line-height:1.5}
.trail li{margin-bottom:6px}

textarea.box{
  width:100%; resize:vertical; font:inherit; font-size:.88rem; line-height:1.55;
  padding:13px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); margin-top:6px;
}
textarea.box.readonly{min-height:150px; color:var(--muted)}
textarea.box.note{min-height:130px; background:var(--surface)}
.mailrow{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px}
.linkish{font-weight:700; color:var(--accent); text-decoration:none; border-bottom:2px solid var(--accent-soft)}
.linkish:hover{border-bottom-color:var(--accent)}
.fieldlabel{font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:22px}
.hint{font-size:.83rem; color:var(--muted); margin:4px 0 0}

.foot{margin-top:26px; text-align:center; font-size:.78rem; color:var(--muted); line-height:1.6}
.foot a{color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" id="brandlink" href="../support.html" title="Greentopia customer support" style="color:inherit;text-decoration:none">
      <svg class="leafmark" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 4C10 4 4.5 8.5 4.5 15.5c0 1.6.4 3 1.1 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:var(--accent)"/>
        <path d="M20 4c0 9-5.5 13.5-12.5 13.5-.8 0-1.6-.1-2.3-.3C6.5 10.5 12 6 20 4Z" fill="currentColor" style="color:var(--accent)" opacity=".9"/>
      </svg>
      <span>
        <span class="brand-name">Greentopia</span><br>
        <span class="brand-sub" id="brandsub">Tower first aid</span>
      </span>
    </a>
    <span class="spacer"></span>
    <span class="langtoggle" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-ja" aria-pressed="false">日本語</button>
    </span>
  </div>
</header>

<main class="wrap">
  <div id="stage" class="card"></div>
  <div class="foot" id="foot"></div>
</main>

         "Check it with a level — the level app on your phone is accurate enough — and put a thin shim under the base until it sits flat. Then run the pump and watch the dry side again."],

         "水平器（スマートフォンの水平器アプリで十分です）で確認し、台座の下に薄い詰め物を入れて水平にしてください。その後ポンプを動かし、乾いていた側をもう一度確認します。"],
      opts:[

      p:["タワーが水平なのに水が全てのポートに届かない場合、ポンプの力が頂部まで押し上げるのに足りていません。原因は主に3つで、いずれも目で見て確認できます。諦める前に必ずご確認ください。",
         "<strong>1. 設置。</strong>ポンプが貯水タンクの底に、まっすぐ垂直に置かれているか。傾いていたり、ケーブルの上に乗っていたりしませんか。<br><strong>2. 吸盤脚。</strong>吸盤がしっかり底面に固定されているか。外れていると振動し、圧力が落ちます。<br><strong>3. 根詰まり。</strong>時間が経つと根が吸込口に入り込み、詰まらせます。ポンプを取り出して確認し、絡みついた根を取り除いてください。",

t_check:{

  en:{t:"Two things cause burnt leaf tips",
      p:["Brown, crispy or curled leaf tips come from either <strong>too much light</strong> or <strong>too little airflow</strong>. They look almost identical on the plant, so the quickest way to tell them apart is to check the light schedule — that's a fact you can read off the timer.",
         "Look at the white light timer. Is the side switch on <span class=\"kbd\">常時通電</span> (always on), or do the pins add up to more than 14 hours a day?"],
      opts:[
        {l:"Yes — the lights run long, or always-on",to:"g_light_fix"},

  ja:{t:"葉先が傷む原因は2つあります",
      p:["葉先が茶色くパリパリになる、または丸まる症状は、<strong>光の当てすぎ</strong>か<strong>風通しの悪さ</strong>のどちらかが原因です。見た目がほぼ同じなので、タイマーで確認できる点灯時間から切り分けるのが最も確実です。",
         "白いライトタイマーをご確認ください。側面のスイッチが <span class=\"kbd\">常時通電</span> になっていませんか。また、ピンの合計が1日14時間を超えていませんか。"],
      opts:[

g_airflow:{
  path:{en:"Leaf tips · 2",ja:"葉先 · 2"},
  banner:{kind:"warn",
    en:"This is tip burn. It's an air problem, not a water or nutrient problem.",
    ja:"チップバーン（葉先枯れ）です。水や肥料ではなく、空気の問題です。"},
  en:{t:"The plants need moving air",
      p:["Tip burn shows up when air sits still around the leaves, and warm room air makes it worse. It's mostly an indoor problem: the plants are growing fast, the canopy is dense, and there isn't enough air exchange to keep up. Outdoors it's rare, which is why we ask for a sunny, <strong>well-ventilated</strong> spot — moving air dries the leaves and holds down pests and powdery mildew at the same time.",
         "Three things help, in the order most people find easiest:",
         "<strong>1. Move the air.</strong> A small fan on its lowest setting, pointed near the tower rather than straight at it, is usually enough. The leaves should stir gently.<br><strong>2. Bring the temperature down.</strong> Air conditioning or an open window during the warm part of the day.<br><strong>3. Thin the plants.</strong> A dense canopy traps its own air. Harvesting opens it up, and it's the fastest of the three.",
         "Already-burnt tips won't heal. Judge it by the new leaves."],
      opts:[
        {l:"Show me how to thin it",to:"harvest",resume:"c_airflow",cls:"primary"},
        {l:"I'll add a fan — what should I look for?",to:"c_airflow"}
      ]},
  ja:{t:"植物には動く空気が必要です",
      p:["チップバーンは、葉のまわりの空気が動かないときに起こり、室温が高いと悪化します。主に屋内で起こる問題です。株が旺盛に育って葉が密集し、空気の入れ替えが追いつかなくなるためです。屋外ではほとんど起こりません。日当たりと<strong>風通し</strong>の良い場所をお願いしているのはこのためで、空気が動くと葉が乾き、害虫やうどんこ病の発生も抑えられます。",
         "対策は3つあります。取り組みやすい順に挙げます。",
         "<strong>1. 空気を動かす。</strong>小型の扇風機を最弱で、タワーに直接ではなく近くに向けて回すだけで十分です。葉がそよぐ程度が目安です。<br><strong>2. 室温を下げる。</strong>日中の暑い時間帯にエアコンを使うか、窓を開けてください。<br><strong>3. 株を間引く。</strong>葉が密集すると空気がこもります。収穫して風の通り道をつくるのが、3つの中で最も即効性があります。",
         "すでに傷んだ葉先は元に戻りません。新しい葉で判断してください。"],
      opts:[
        {l:"間引き方を見る",to:"harvest",resume:"c_airflow",cls:"primary"},
        {l:"扇風機を用意します — 次に何を見ればいいですか？",to:"c_airflow"}
      ]}
},

      ]}

  banner:{kind:"good",
    en:"Take a third of the plant, half at the very most. What you leave behind is what grows back.",

/* ---------- engine ---------- */
const EMAIL = "info@greentopia.jp";
let lang = "en";
let stack = [];
let current = "start";
let resume = null;
let state = {};
let notes = [];
let noteText = "";

const stage = document.getElementById("stage");
const foot  = document.getElementById("foot");

try{ const q = new URLSearchParams(location.search).get("lang"); const s = (q==="ja"||q==="en") ? q : localStorage.getItem("gt_lang"); if(s==="ja"||s==="en") lang = s; }catch(e){}

function setLang(l){
  lang = l;
  try{ localStorage.setItem("gt_lang", l); }catch(e){}
  document.documentElement.lang = (l==="ja" ? "ja" : "en");
  var bl = document.getElementById("brandlink"); if(bl) bl.href = (l==="ja" ? "../ja/support.html" : "../support.html");
  document.getElementById("lang-en").setAttribute("aria-pressed", String(l==="en"));
  document.getElementById("lang-ja").setAttribute("aria-pressed", String(l==="ja"));
  document.getElementById("brandsub").textContent = UI[l].sub;
  render();
}
document.getElementById("lang-en").addEventListener("click",()=>setLang("en"));
document.getElementById("lang-ja").addEventListener("click",()=>setLang("ja"));

function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html!=null) n.innerHTML = html;
  return n;
}
function stripTags(s){ const d=document.createElement("div"); d.innerHTML=s; return (d.textContent||"").trim(); }

const ICONS = {
  warn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.6 1.9 21h20.2L12 3.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.6v4.6M12 17.4h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  stop:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8.4 8.4l7.2 7.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  good:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.3l2.6 2.6L16 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const CHEV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function summaryText(){
  const lines = stack.map((s,i)=> (i+1)+". "+s.label);
  notes.forEach(n=> lines.push("! "+n));
  return lines.join("\n");
}

function render(){
  const n = T[current];
  const c = n[lang];
  stage.innerHTML = "";
  stage.appendChild(el("div","eyebrow", n.path[lang]));
  stage.appendChild(el("h1",null,c.t));
  if(c.lede) stage.appendChild(el("p","lede",c.lede));

  if(n.banner){
    const b = el("div","banner "+n.banner.kind);
    b.appendChild(el("span","ico",ICONS[n.banner.kind]));
    b.appendChild(el("span",null,n.banner[lang]));
    stage.appendChild(b);
  }

  if(c.p && c.p.length){
    const pr = el("div","prose");
    c.p.forEach(t=> pr.appendChild(el("p",null,t)));
    stage.appendChild(pr);
  }

  if(n.photos && n.photos.length){
    const g = el("div","photos"+(n.photos.length>1?" two":""));
    n.photos.forEach(([k,ce,cj])=>{
      if(!IMG[k]) return;
      const f = el("figure");
      const im = document.createElement("img");
      im.src = IMG[k]; im.alt = (lang==="ja"?cj:ce); im.loading = "lazy";
      f.appendChild(im);
      f.appendChild(el("figcaption",null,lang==="ja"?cj:ce));
      g.appendChild(f);
    });
    stage.appendChild(g);
  }

  if(n.contact) renderContact();

  if(c.opts && c.opts.length){
    const box = el("div","opts");
    c.opts.forEach((o,i)=>{
      if(o.head){ box.appendChild(el("div","optgroup",o.head)); return; }
      const b = el("button","opt"+(o.cls?" "+o.cls:""));
      b.type = "button";
      b.appendChild(el("span","txt",o.l));
      b.appendChild(el("span","chev",CHEV));
      b.addEventListener("click",()=>choose(current,i));
      box.appendChild(b);
    });
    stage.appendChild(box);
  }

  const nav = el("div","nav");
  if(stack.length){
    const back = el("button","navbtn",UI[lang].back);
    back.type="button"; back.addEventListener("click",goBack);
    nav.appendChild(back);
    const re = el("button","navbtn",UI[lang].restart);
    re.type="button"; re.addEventListener("click",restart);
    nav.appendChild(re);
  }
  if(nav.children.length) stage.appendChild(nav);

  if(stack.length && !n.contact){
    const d = el("details","trail");
    d.appendChild(el("summary",null,UI[lang].trail));
    const ol = el("ol");
    stack.forEach(s=> ol.appendChild(el("li",null,s.shown)));
    d.appendChild(ol);
    stage.appendChild(d);
  }

  foot.innerHTML = UI[lang].foot.replace(EMAIL,'<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>');
  window.scrollTo({top:0,behavior:"instant"});
}

function renderContact(){
  const box = el("div");

  box.appendChild(el("div","fieldlabel", lang==="ja" ? "確認済みの内容" : "What you checked"));
  const auto = document.createElement("textarea");
  auto.className = "box readonly"; auto.id = "gt-auto"; auto.readOnly = true;
  auto.value = summaryText() || (lang==="ja" ? "（なし）" : "(none)");
  box.appendChild(auto);

  box.appendChild(el("div","fieldlabel", lang==="ja" ? "あなたからの情報" : "Your details and notes"));
  box.appendChild(el("p","hint", lang==="ja"
    ? "お名前と設置場所をご記入ください。気づいたことがあれば何でもお書きください。"
    : "Add your name and where the tower is. Anything else you've noticed is helpful too."));
  const note = document.createElement("textarea");
  note.className = "box note"; note.id = "gt-note";
  note.value = noteText || (lang==="ja"
    ? "お名前：\n設置場所：\nタワー：屋内 / 屋外\n\n補足："
    : "Name:\nLocation:\nTower: indoor / outdoor\n\nAnything else:");
  box.appendChild(note);

  const row = el("div","mailrow");
  const a = document.createElement("a");
  a.className = "opt primary"; a.id = "gt-mail";
  a.style.textDecoration = "none"; a.style.justifyContent = "center";
  a.textContent = lang==="ja" ? "メールを作成する" : "Open an email";
  row.appendChild(a);
  box.appendChild(row);

  const hint = el("p","hint", lang==="ja"
    ? 'メールが開かない場合は、上の内容をコピーして <a class="linkish" href="mailto:'+EMAIL+'">'+EMAIL+'</a> 宛にお送りください。'
    : 'If that doesn\'t open your mail app, copy the text above and send it to <a class="linkish" href="mailto:'+EMAIL+'">'+EMAIL+'</a>.');
  hint.style.marginTop = "12px";
  box.appendChild(hint);

  stage.appendChild(box);

  function refresh(){
    noteText = note.value;
    const subject = lang==="ja" ? "タワーのサポート依頼" : "Tower support request";
    const body = noteText + "\n\n"
      + (lang==="ja" ? "--- 確認済みの内容 ---\n" : "--- Checks completed ---\n")
      + auto.value;
    a.href = "mailto:"+EMAIL+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  }
  note.addEventListener("input", refresh);
  refresh();
}

function choose(nodeId, idx){
  const node = T[nodeId];
  const optEN = node.en.opts[idx];
  const optCur = node[lang].opts[idx];

  if(optEN.to === "@restart"){ restart(); return; }

  stack.push({
    node: nodeId,
    resume: resume,
    state: Object.assign({}, state),
    notesLen: notes.length,
    label: stripTags(node.en.t) + " — " + stripTags(optEN.l),
    shown: stripTags(node[lang].t) + " — " + stripTags(optCur.l)
  });
  if(optEN.note) notes.push(optEN.note);
  if(optEN.resume) resume = optEN.resume;
  if(optEN.set) Object.assign(state, optEN.set);

  let to = optEN.to;
  if(to === "@resume"){
    to = resume || optEN.fallback || "contact";
    resume = null;
  } else if(to.indexOf("@state.") === 0){
    to = state[to.slice(7)] || optEN.fallback || "contact";
  }
  current = T[to] ? to : "contact";
  render();
}

function goBack(){
  const prev = stack.pop();
  if(!prev) return;
  notes = notes.slice(0, prev.notesLen);
  resume = prev.resume;
  state = Object.assign({}, prev.state);
  current = prev.node;
  render();
}

function restart(){
  stack=[]; notes=[]; resume=null; state={}; noteText=""; current="start"; render();
}

setLang(lang);
</script>
